[project]
name = "customer-segmentation"
version = "1.0.0"
description = "RFM segmentation with cluster diagnostics feeding a Power BI report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# No service here, so there is no runtime/analysis split to make:
# these are what the notebook needs.
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
    "ruff==0.16.4",
]

[tool.ruff]
# Notebooks are deliberately excluded: `import a; import b` on one line and
# imports part-way down a file are normal notebook style, and enforcing library
# rules on exploratory cells produces noise rather than quality.
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "venv", "mlruns", "dashboard", "data", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008 is the FastAPI dependency-injection idiom (Depends(), File()), not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# The project is not installed as a package, so make the root importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# These are applications, not libraries: install the dependencies, not the project.
package = false
