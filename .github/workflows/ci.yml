name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Ruff
        run: uv run --frozen ruff check --output-format=github .

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Advisory, not blocking: a fresh CVE in a transitive pin should not turn
      # the whole portfolio red overnight. Dependabot opens the fixing PR.
      # The audit runs against the resolved lockfile, so it covers the whole
      # transitive tree rather than just the direct pins.
      - name: Audit the locked dependency tree
        continue-on-error: true
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > locked-requirements.txt
          uvx pip-audit -r locked-requirements.txt --desc
