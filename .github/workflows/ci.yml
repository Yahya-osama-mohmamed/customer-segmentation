name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.4
      - name: Ruff
        run: ruff check --output-format=github .

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Advisory, not blocking: a fresh CVE in a transitive pin should not turn
      # the whole portfolio red overnight. Dependabot opens the fixing PR.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc
