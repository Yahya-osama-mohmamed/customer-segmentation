name: Publish analysis

on:
  push:
    branches: [main]
    paths:
      - "**.ipynb"
      - "figures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Render notebook to HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbconvert
        run: pip install nbconvert jupyter

      - name: Render
        # The notebook is published exactly as committed, outputs and all. It is
        # NOT re-executed here: the source workbook is a 45 MB UCI download that
        # is deliberately not in the repository, so a CI re-run would either fail
        # or silently publish an empty analysis.
        run: |
          mkdir -p site
          jupyter nbconvert --to html --output-dir site --output index \
            customer_segmentation.ipynb
          cp -r figures site/figures 2>/dev/null || true
          ls -lh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
